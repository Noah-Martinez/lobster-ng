name: Live title smoke test

on:
  pull_request:
    paths:
      - .github/workflows/live-title-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Test live catalog and playback resolution
        shell: bash
        run: |
          set -euo pipefail

          smoke_root="$RUNNER_TEMP/lobster-live-smoke"
          mkdir -p \
            "$smoke_root/bin" \
            "$smoke_root/home/.config/lobster" \
            "$smoke_root/data" \
            "$smoke_root/cache"

          cat >"$smoke_root/bin/fzf" <<'EOF_FZF'
          #!/usr/bin/env sh
          input=$(cat)

          case "$*" in
            *"Choose a Movie or TV Show"*)
              selected=$(printf '%s\n' "$input" | awk -F '\t' \
                -v expected_type="$LOBSTER_SMOKE_TYPE" \
                -v expected_title="$LOBSTER_SMOKE_TITLE" '
                  $3 == expected_type && index(tolower($4), tolower(expected_title)) {
                    print
                    exit
                  }
                ')
              ;;
            *"Select a season"*)
              selected=$(printf '%s\n' "$input" | awk -F '\t' \
                -v expected="$LOBSTER_SMOKE_SEASON" '$2 == expected { print; exit }')
              ;;
            *"Select an episode"*)
              selected=$(printf '%s\n' "$input" | awk -F '\t' \
                -v expected="$LOBSTER_SMOKE_EPISODE" '$2 == expected { print; exit }')
              ;;
            *)
              selected=$(printf '%s\n' "$input" | head -n 1)
              ;;
          esac

          if [ -z "$selected" ]; then
            printf 'Smoke-test selector found no matching entry.\nInput was:\n%s\n' "$input" >&2
            exit 1
          fi

          # Lobster uses fzf --expect and therefore expects a leading blank line.
          printf '\n%s\n' "$selected"
          EOF_FZF
          chmod +x "$smoke_root/bin/fzf"

          cat >"$smoke_root/home/.config/lobster/lobster_config.sh" <<'EOF_CONFIG'
          player="true"
          history="false"
          remove_tmp_lobster="true"
          image_preview="false"
          use_external_menu="false"
          EOF_CONFIG

          run_case() {
            query=$1
            expected_title=$2
            expected_type=$3
            output_file=$4

            printf '\n=== Testing query: %s ===\n' "$query"

            HOME="$smoke_root/home" \
            XDG_CONFIG_HOME="$smoke_root/home/.config" \
            XDG_DATA_HOME="$smoke_root/data" \
            XDG_CACHE_HOME="$smoke_root/cache" \
            PATH="$smoke_root/bin:$PATH" \
            LOBSTER_PROVIDER_DIR="$GITHUB_WORKSPACE/providers" \
            LOBSTER_SMOKE_TITLE="$expected_title" \
            LOBSTER_SMOKE_TYPE="$expected_type" \
            LOBSTER_SMOKE_SEASON=1 \
            LOBSTER_SMOKE_EPISODE=1 \
              timeout 150s ./lobster.sh --json "$query" >"$output_file"

            jq -e '
              [.. | objects | .file? // empty | select(type == "string" and test("\\.m3u8(?:$|\\?)"))]
              | length > 0
            ' "$output_file" >/dev/null

            printf 'Resolved playable HLS source for %s.\n' "$query"
          }

          nix shell nixpkgs#jq --command bash -c '
            set -euo pipefail
            export smoke_root="$1"
            export GITHUB_WORKSPACE="$2"
            export -f run_case
            run_case "Dr Who" "Doctor Who" tv "$smoke_root/doctor-who.json"
            run_case "Howls Moving Castle" "Howl'"'"'s Moving Castle" movie "$smoke_root/howls-moving-castle.json"
          ' bash "$smoke_root" "$GITHUB_WORKSPACE"
