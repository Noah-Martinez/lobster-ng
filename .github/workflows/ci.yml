name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check flake
        run: |
          if ! nix flake check --print-build-logs >nix-check.log 2>&1; then
            tail -n 100 nix-check.log
            exit 1
          fi

      - name: Upload Nix check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nix-check-log
          path: nix-check.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build package
        run: nix build .#lobster --no-link
