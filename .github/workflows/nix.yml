name: Nix

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Collect diagnostics
        id: diagnostics
        shell: bash
        run: |
          set +e
          : >ci-diagnostics.log

          echo '=== current shfmt ===' >>ci-diagnostics.log
          nix shell \
            github:NixOS/nixpkgs/nixos-unstable#shellcheck \
            github:NixOS/nixpkgs/nixos-unstable#shfmt \
            --command sh -c '
              shellcheck --version
              shfmt --version
              shfmt -d lobster.sh providers tests
            ' >>ci-diagnostics.log 2>&1
          shfmt_status=$?

          echo '=== current shellcheck ===' >>ci-diagnostics.log
          nix shell \
            github:NixOS/nixpkgs/nixos-unstable#shellcheck \
            --command shellcheck \
              lobster.sh providers/catalog/*.sh providers/stream/*.sh tests/*.sh \
              >>ci-diagnostics.log 2>&1
          shellcheck_status=$?

          user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'
          curl -L -sS --compressed -A "$user_agent" \
            -G --data-urlencode 'query=Ugly Betty' \
            https://www.themoviedb.org/search \
            -o tmdb-live.html
          curl -L -sS --compressed -A "$user_agent" \
            -H 'Accept-Language: en-US,en;q=0.8' \
            -G --data-urlencode 'q=Ugly Betty' \
            https://www.imdb.com/find/ \
            -o imdb-live.html

          echo '=== live catalog smoke test ===' >>ci-diagnostics.log
          nix develop --command sh -c '
            echo "-- TMDB --"
            ./providers/catalog/tmdb.sh search "Ugly Betty" | head -n 3
            tmdb_status=$?
            echo "-- IMDb --"
            ./providers/catalog/imdb.sh search "Ugly Betty" | head -n 3
            imdb_status=$?
            test "$tmdb_status" -eq 0 -o "$imdb_status" -eq 0
          ' >>ci-diagnostics.log 2>&1
          catalog_status=$?

          echo '=== nix flake check ===' >>ci-diagnostics.log
          nix flake check --print-build-logs >>ci-diagnostics.log 2>&1
          nix_status=$?

          git fetch origin main --depth=1
          git show origin/main:lobster.sh >original-lobster.sh

          echo "statuses: shfmt=$shfmt_status shellcheck=$shellcheck_status catalog=$catalog_status nix=$nix_status" >>ci-diagnostics.log
          status=0
          if ((shfmt_status || shellcheck_status || catalog_status || nix_status)); then
            status=1
          fi
          echo "status=$status" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            ci-diagnostics.log
            lobster.sh
            original-lobster.sh
            providers
            tests
            tmdb-live.html
            imdb-live.html

      - name: Check result
        if: always()
        run: exit "${{ steps.diagnostics.outputs.status }}"
