name: Nix

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Collect diagnostics
        id: diagnostics
        shell: bash
        run: |
          set +e
          {
            echo '=== shfmt ==='
            nix develop --command sh -c 'shfmt -d lobster.sh providers tests'
            shfmt_status=$?

            echo '=== shellcheck ==='
            nix develop --command shellcheck --severity=error lobster.sh providers/catalog/*.sh providers/stream/*.sh tests/*.sh
            shellcheck_status=$?

            echo '=== nix flake check ==='
            nix flake check --print-build-logs
            nix_status=$?

            echo "statuses: shfmt=$shfmt_status shellcheck=$shellcheck_status nix=$nix_status"
            if ((shfmt_status || shellcheck_status || nix_status)); then
              exit 1
            fi
          } >ci-diagnostics.log 2>&1
          status=$?
          echo "status=$status" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: ci-diagnostics.log

      - name: Check result
        if: always()
        run: exit "${{ steps.diagnostics.outputs.status }}"
