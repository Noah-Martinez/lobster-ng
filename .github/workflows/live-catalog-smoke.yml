name: Live catalog smoke test

on:
  pull_request:
    paths:
      - .github/workflows/live-catalog-smoke.yml

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test Doctor Who TV lookup
        shell: bash
        run: |
          set -euo pipefail
          output=$(./providers/catalog/tmdb.sh search "Dr Who")
          printf '%s\n' "$output"
          printf '%s\n' "$output" | awk -F '\t' \
            -v expected="doctor who" '
              $3 == "tv" && index(tolower($4), expected) { found = 1 }
              END { exit(found ? 0 : 1) }
            '

      - name: Test Howl's Moving Castle movie lookup
        shell: bash
        run: |
          set -euo pipefail
          output=$(./providers/catalog/tmdb.sh search "Howls Moving Castle")
          printf '%s\n' "$output"
          printf '%s\n' "$output" | awk -F '\t' \
            -v expected="howl's moving castle" '
              $3 == "movie" && index(tolower($4), expected) { found = 1 }
              END { exit(found ? 0 : 1) }
            '
