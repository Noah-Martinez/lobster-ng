name: Run provider migration

on:
  pull_request:
    paths:
      - .github/workflows/apply-provider-migration-run.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/replace-flixhq-provider

      - name: Apply stored migration
        id: apply
        shell: bash
        run: |
          set +e
          {
            set -x
            wc -c .github/provider-migration.b64
            base64 -d .github/provider-migration.b64 > /tmp/provider-migration.tar.gz
            base64_status=$?
            gzip -t /tmp/provider-migration.tar.gz
            gzip_status=$?
            tar -tzf /tmp/provider-migration.tar.gz
            list_status=$?

            status=0
            if ((base64_status || gzip_status || list_status)); then
              status=1
            else
              tar -xzf /tmp/provider-migration.tar.gz -C .
              rm -f \
                .github/provider-migration.b64 \
                .github/workflows/apply-provider-migration.yml \
                .github/workflows/apply-provider-migration-run.yml
              git config user.name github-actions[bot]
              git config user.email 41898282+github-actions[bot]@users.noreply.github.com
              git add -A
              git commit -m "fix: preserve legacy features with provider fallbacks"
              commit_status=$?
              if ((commit_status == 0)); then
                git push origin HEAD:fix/replace-flixhq-provider
                status=$?
              else
                status=$commit_status
              fi
            fi
            echo "status=$status"
          } >migration.log 2>&1
          echo "status=$status" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Upload migration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-migration-log
          path: migration.log

      - name: Check result
        if: always()
        run: exit "${{ steps.apply.outputs.status }}"
