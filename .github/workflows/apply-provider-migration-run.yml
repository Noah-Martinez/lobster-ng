name: Run provider migration

on:
  pull_request:
    paths:
      - .github/workflows/apply-provider-migration-run.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/replace-flixhq-provider

      - name: Apply stored migration
        shell: bash
        run: |
          sed -n "/^H4sI/,/^          PAYLOAD$/p" .github/workflows/apply-provider-migration.yml \
            | sed '$d' \
            | sed 's/^          //' \
            > /tmp/payload.b64
          base64 -d /tmp/payload.b64 | tar -xzf - -C .
          rm -f \
            .github/workflows/apply-provider-migration.yml \
            .github/workflows/apply-provider-migration-run.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: preserve legacy features with provider fallbacks"
          git push origin HEAD:fix/replace-flixhq-provider
