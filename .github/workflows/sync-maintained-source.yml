name: Sync maintained source

on:
  push:
    branches:
      - agent/security-hardening-flake
    paths:
      - scripts/harden.py
      - scripts/update_readme.py
      - .github/workflows/sync-maintained-source.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-hardening-flake

      - name: Apply maintained-source transformations
        run: |
          python3 scripts/harden.py lobster.sh
          python3 scripts/update_readme.py README.md

      - name: Commit generated source
        run: |
          if git diff --quiet -- lobster.sh README.md; then
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lobster.sh README.md
          git commit -m "fix: sync maintained source"
          git push
