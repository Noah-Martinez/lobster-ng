name: Apply final lint fix

on:
  pull_request:
    paths:
      - .github/workflows/apply-final-lint-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/replace-flixhq-provider

      - name: Apply source fixes and clean diagnostics
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}, found {text.count(old)}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "lobster.sh",
              "                ;;\n        esac\n\n        update=",
              "                ;;\n            *) ;;\n        esac\n\n        update=",
          )

          replace_once(
              "providers/catalog/tmdb.sh",
              "            episode) printf 'Episode %s\\t%s\\n' \"$number\" \"$number\" ;;\n        esac\n    done",
              "            episode) printf 'Episode %s\\t%s\\n' \"$number\" \"$number\" ;;\n            *) fail 64 \"unsupported numbered-link kind '$kind'\" ;;\n        esac\n    done",
          )
          replace_once(
              "providers/catalog/tmdb.sh",
              "            *[!0-9]* | '') fail 64 \"invalid season '$season'\" ;;\n        esac\n        fetch_page",
              "            *[!0-9]* | '') fail 64 \"invalid season '$season'\" ;;\n            *) ;;\n        esac\n        fetch_page",
          )

          for path in ("providers/stream/vidapi.sh", "providers/stream/vidcore.sh"):
              replace_once(
                  path,
                  "            *[!0-9:]* | :* | *:) fail 64 \"TV playback requires numeric season and episode\" ;;\n        esac\n        printf",
                  "            *[!0-9:]* | :* | *:) fail 64 \"TV playback requires numeric season and episode\" ;;\n            *) ;;\n        esac\n        printf",
              )

          replace_once(
              "tests/provider-interface.sh",
              "[ \"$(\"$repo_dir/providers/stream/vidapi.sh\" movie tmdb:550 '' '' en)\" = 'https://vaplayer.ru/embed/movie/550?lang=en' ]\n[ \"$(\"$repo_dir/providers/stream/vidcore.sh\" tv tmdb:1396 1 1 en)\" = 'https://vidcore.org/embed/tv/1396/1/1?sub=en' ]",
              "vidapi_url=$(\"$repo_dir/providers/stream/vidapi.sh\" movie tmdb:550 '' '' en)\n[ \"$vidapi_url\" = 'https://vaplayer.ru/embed/movie/550?lang=en' ]\nvidcore_url=$(\"$repo_dir/providers/stream/vidcore.sh\" tv tmdb:1396 1 1 en)\n[ \"$vidcore_url\" = 'https://vidcore.org/embed/tv/1396/1/1?sub=en' ]",
          )
          replace_once(
              "tests/provider-interface.sh",
              "mkdir -p \"$tmp_dir/bin\" \"$tmp_dir/home/.config/lobster\" \"$tmp_dir/data\" \"$tmp_dir/cache\"\ncat >\"$tmp_dir/home/.config/lobster/lobster_config.sh\"",
              "mkdir -p \"$tmp_dir/bin\" \"$tmp_dir/home/.config/lobster\" \"$tmp_dir/data\" \"$tmp_dir/cache\"\nshell_path=$(command -v sh)\ncat >\"$tmp_dir/home/.config/lobster/lobster_config.sh\"",
          )
          tests = Path("tests/provider-interface.sh")
          text = tests.read_text()
          old = "    printf '#!%s\\n' \"$(command -v sh)\""
          if text.count(old) != 2:
              raise SystemExit(f"expected two generated shebangs, found {text.count(old)}")
          tests.write_text(text.replace(old, "    printf '#!%s\\n' \"$shell_path\""))
          PY

          cat >.github/workflows/nix.yml <<'EOF_NIX'
          name: Nix

          on:
            pull_request:
            push:
              branches:
                - main
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            check:
              runs-on: ubuntu-latest
              steps:
                - name: Check out repository
                  uses: actions/checkout@v4

                - name: Install Nix
                  uses: cachix/install-nix-action@v31

                - name: Check flake
                  run: nix flake check --print-build-logs
          EOF_NIX
          sed -i 's/^          //' .github/workflows/nix.yml

          rm -f \
            .github/workflows/exact-provider-lint.yml \
            .github/workflows/apply-final-lint-fix.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: satisfy inherited shell lint rules"
          git push origin HEAD:fix/replace-flixhq-provider
