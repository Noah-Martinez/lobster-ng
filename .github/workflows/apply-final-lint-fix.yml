name: Apply final lint fix

on:
  pull_request:
    paths:
      - .github/workflows/apply-final-lint-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/replace-flixhq-provider

      - name: Apply source fixes and clean diagnostics
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected fragment not found in {path}:\n{old}")
              file.write_text(text.replace(old, new, 1))

          replace(
              "lobster.sh",
              '''            /nix/store/*)
                          send_notification "Installed through Nix" "5000" "" "Update the lobster-ng flake input and rebuild instead"
                          exit 1
                          ;;
                  esac''',
              '''            /nix/store/*)
                          send_notification "Installed through Nix" "5000" "" "Update the lobster-ng flake input and rebuild instead"
                          exit 1
                          ;;
                      *) ;;
                  esac''',
          )

          replace(
              "providers/catalog/tmdb.sh",
              '''            season) printf 'Season %s\\t%s\\n' "$number" "$number" ;;
                      episode) printf 'Episode %s\\t%s\\n' "$number" "$number" ;;
                  esac''',
              '''            season) printf 'Season %s\\t%s\\n' "$number" "$number" ;;
                      episode) printf 'Episode %s\\t%s\\n' "$number" "$number" ;;
                      *) fail 64 "unsupported numbered-link kind '$kind'" ;;
                  esac''',
          )
          replace(
              "providers/catalog/tmdb.sh",
              '''        case "$season" in
                          *[!0-9]* | '') fail 64 "invalid season '$season'" ;;
                      esac''',
              '''        case "$season" in
                          *[!0-9]* | '') fail 64 "invalid season '$season'" ;;
                          *) ;;
                      esac''',
          )

          for path in ("providers/stream/vidapi.sh", "providers/stream/vidcore.sh"):
              replace(
                  path,
                  '''        case "$season:$episode" in
                              *[!0-9:]* | :* | *:) fail 64 "TV playback requires numeric season and episode" ;;
                          esac''',
                  '''        case "$season:$episode" in
                              *[!0-9:]* | :* | *:) fail 64 "TV playback requires numeric season and episode" ;;
                              *) ;;
                          esac''',
              )

          replace(
              "tests/provider-interface.sh",
              '''[ "$("$repo_dir/providers/stream/vidapi.sh" movie tmdb:550 '' '' en)" = 'https://vaplayer.ru/embed/movie/550?lang=en' ]
          [ "$("$repo_dir/providers/stream/vidcore.sh" tv tmdb:1396 1 1 en)" = 'https://vidcore.org/embed/tv/1396/1/1?sub=en' ]''',
              '''vidapi_url=$("$repo_dir/providers/stream/vidapi.sh" movie tmdb:550 '' '' en)
          [ "$vidapi_url" = 'https://vaplayer.ru/embed/movie/550?lang=en' ]
          vidcore_url=$("$repo_dir/providers/stream/vidcore.sh" tv tmdb:1396 1 1 en)
          [ "$vidcore_url" = 'https://vidcore.org/embed/tv/1396/1/1?sub=en' ]''',
          )
          replace(
              "tests/provider-interface.sh",
              '''mkdir -p "$tmp_dir/bin" "$tmp_dir/home/.config/lobster" "$tmp_dir/data" "$tmp_dir/cache"
          cat >"$tmp_dir/home/.config/lobster/lobster_config.sh"''',
              '''mkdir -p "$tmp_dir/bin" "$tmp_dir/home/.config/lobster" "$tmp_dir/data" "$tmp_dir/cache"
          shell_path=$(command -v sh)
          cat >"$tmp_dir/home/.config/lobster/lobster_config.sh"''',
          )
          text = Path("tests/provider-interface.sh").read_text()
          expected = '''    printf '#!%s\\n' "$(command -v sh)"'''
          if text.count(expected) != 2:
              raise SystemExit("expected two generated-script shebangs")
          Path("tests/provider-interface.sh").write_text(
              text.replace(expected, '''    printf '#!%s\\n' "$shell_path"''')
          )
          PY

          cat >.github/workflows/nix.yml <<'EOF_NIX'
          name: Nix

          on:
            pull_request:
            push:
              branches:
                - main
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            check:
              runs-on: ubuntu-latest
              steps:
                - name: Check out repository
                  uses: actions/checkout@v4

                - name: Install Nix
                  uses: cachix/install-nix-action@v31

                - name: Check flake
                  run: nix flake check --print-build-logs
          EOF_NIX
          sed -i 's/^          //' .github/workflows/nix.yml

          rm -f \
            .github/workflows/exact-provider-lint.yml \
            .github/workflows/apply-final-lint-fix.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: satisfy inherited shell lint rules"
          git push origin HEAD:fix/replace-flixhq-provider
