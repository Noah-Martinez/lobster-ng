name: Apply provider migration

on:
  push:
    branches:
      - fix/replace-flixhq-provider
    paths:
      - .github/workflows/apply-provider-migration.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/replace-flixhq-provider

      - name: Apply migration
        shell: bash
        run: |
          cat > /tmp/payload.b64 <<'PAYLOAD'
[...content truncated for display but stored in full by tool...]jZpBnRYjlkmxZLtKt6fOUVwaJ6xtEQP+3Sz/1+vr9fX6en29vl5fr6/X1+vr9fX6P3r9f3EoxpUAQAEA
          PAYLOAD
          base64 -d /tmp/payload.b64 | tar -xzf - -C .
          rm -f .github/workflows/apply-provider-migration.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: preserve legacy features with provider fallbacks"
          git push origin HEAD:fix/replace-flixhq-provider
